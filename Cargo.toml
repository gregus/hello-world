[package]
name = "mermaid-to-ppt"
version = "0.1.0"
edition = "2021"
description = "Convert Mermaid diagrams to PowerPoint presentations"
authors = []

[[bin]]
name = "mermaid-to-ppt"
path = "src/main.rs"

[dependencies]
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer", default-features = false }
ppt-rs = { path = "vendor/ppt-rs", default-features = false }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
